alpha_overlay:
  enabled: false
  weight: 3.0
  cap: 6.0
  note: '【2026-08-26 禁用】组合模拟实证: Top50相对全池超额-80bp/日、Top500 -49bp——信号alpha集中在空头端(Q1识别大跌票),
    A股无做空机制下多头overlay反而放大亏损。保留chip_guard(排除高获利盘)与bottom_guard(排除截面后20%)'
chip_guard:
  enabled: true
  z_threshold: 1.5
  note: '获利盘压力排除器: 截面chip_z>阈值剔除(分层t=-3.06全场最强负信号)'
ashare_guard:
  enabled: true
  bottom_exclude_frac: 0.10
  min_candidates: 10
  note: 'ashare_specific弱信号排除器: 截面ashare_specific最低10%剔除(2026-08组合模拟A/B证实alpha在空头端,hold=5空头年化+8.8%/胜率60.9%)'
