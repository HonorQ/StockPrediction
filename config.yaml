filter:
  max_recommend: 2
  min_score: 53
  min_strong_signals: 1
  quick_score:
    top_n_default: 30
    top_n_bull: 50
    top_n_defensive: 20
    change_weight: 3
    change_cap: 20
    turnover2_bonus: 10
    turnover5_bonus: 5
    volume_ratio_bonus: 10
    hot_bonus: 15
    mv_sweet_bonus: 5
    news_bonus_cap: 10
  entry_risk:
    max_gap_open_prob: 70
    block_high_chip: true
    block_volume_divergence: true
  intraday_crash:
    limit_down_threshold: 30
    avg_change_threshold: -1.5
# 分级阈值：统一控制信号强度/情绪周期/因子归因等分级判定
# 修改任一阈值须同步全量回测验证，避免"调参幻觉"
score_tiers:
  # 信号强度（screener.filter_signal_strength 使用）
  strong_signal: 70
  # 情绪周期（ashare_specific.SentimentCycle 使用）
  sentiment_ice: 30
  sentiment_low: 45
  sentiment_warm: 60
  sentiment_hot: 75
  # 因子归因（factor_attribution 使用）
  factor_bullish: 60
  factor_bearish: 40
  # ML 预测分级（ml_selector 使用，概率值）
  ml_bullish: 0.65
  ml_slightly_bullish: 0.55
  ml_slightly_bearish: 0.45
  ml_bearish: 0.35
  # 护城河分级（business_profile / reporter 使用）
  moat_strong: 70
  moat_medium: 55
  # 反弹持续性分级（rebound_analysis 使用）
  rebound_bullish: 70
  rebound_slightly_bullish: 55
  rebound_slightly_bearish: 45
  rebound_bearish: 30
  # 热股情绪分级（hot_stocks 使用）
  hot_warm: 70
  hot_cool: 50
