regime:
  # 择时开关(assess_regime/empty_on_bear 清仓防守)保持有效；
  # 仅清空 weights 覆盖段(2026-09-11): 该段是 24 维旧架构的残留,
  # 2026-08-27 胜率校准后 23 维因子已清零, regime 覆盖会静默复活
  # 过拟合因子(trend/strategy/news 等), 且覆盖发生在 scorer 归一化之后,
  # 总和漂移至 1.2~1.37 无人校验。恢复前需重新做全量胜率校准。
  # (旧覆盖段权重依据 reports/market_ic_verdict.json 全市场IC终审 2026-08)
  enabled: true
  empty_on_bear: true
  bear_score_threshold: 35
  weights: {}
weights:
  # 新架构(2026-08-27): 仅ashare_specific参与评分, 其余因子降级为数据记录
  # 依据: 全市场24因子胜率校准, 仅ashare_specific样本外稳定(58.9%胜率)
  ashare_specific: 1.0
  capital_behavior: 0
  chip: 0
  circulate_holder: 0
  deep_research: 0
  dragon_tiger: 0
  fundamental: 0
  holder_concentration: 0
  institutional: 0
  leader: 0
  lockup_risk: 0
  margin_trading: 0
  moat: 0
  national_team: 0
  news: 0
  oversold_rebound: 0
  policy_event: 0
  quant_behavior: 0
  relative_strength: 0
  research: 0
  sector_rotation: 0
  shareholder: 0
  strategy: 0
  trend: 0
signal_invert:
  enabled: false
  regimes: []
  note: '已禁用: 唯一评分因子(ashare_specific)不需反转, trend/strategy已不参与评分'
alpha_overlay:
  enabled: false
  weight: 3.0
  cap: 6.0
  note: '【2026-08-26 禁用】组合模拟实证: Top50相对全池超额-80bp/日、Top500 -49bp——信号alpha集中在空头端(Q1识别大跌票),
    A股无做空机制下多头overlay反而放大亏损。保留chip_guard(排除高获利盘)与bottom_guard(排除截面后20%)'
chip_guard:
  enabled: true
  z_threshold: 1.5
  note: '获利盘压力排除器: 截面chip_z>阈值剔除(分层t=-3.06全场最强负信号)'
ashare_guard:
  enabled: true
  bottom_exclude_frac: 0.10
  min_candidates: 10
  note: 'ashare_specific弱信号排除器: 截面ashare_specific最低10%剔除(2026-08组合模拟A/B证实alpha在空头端,hold=5空头年化+8.8%/胜率60.9%)'
us_sector_guard:
  enabled: false
  drop_threshold: -2.0
  note: '已禁用: 板块联动无显著相关性, 被supply_chain_guard替代(供应链有真实业务关系, lift=4-11%)'
supply_chain_guard:
  enabled: true
  drop_threshold: -2.0
  note: '美股供应链风控: 美股跌>2%时排除其A股供应商(2026-08全年数据分析: 特斯拉跌>2%供应链lift=-8.3%, 英伟达跌>2%lift=-3.9%)'
oversold_rebound_guard:
  enabled: true
  top_exclude_frac: 0.10
  note: '超跌反弹反向排除器: 截面oversold_rebound最高10%剔除(分层Q10-Q1=-42.1bp/t=-1.98, 高分位反而跌)'
liquidity_guard:
  enabled: true
  min_daily_amount_yi: 0.5
  note: '低流动性排除器: 日均成交额<5000万的票在极端行情下无法止损(A股无做空,流动性是硬约束)'
